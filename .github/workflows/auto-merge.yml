name: Auto Create PR and Merge

on:
  push:
    branches:
      - "dev"
      - "dev/**"

jobs:
  auto-pr-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read # 追加：テストの実行状況(Checks)を読み取る権限
      statuses: read # 追加：コミットのステータスを読み取る権限
      actions: read # 追加：Actionsの動作状況を読み取る権限
    steps:
      - name: Checkout repository # ← これを追加！
        uses: actions/checkout@v4 # ← これを追加！

      - name: Create PR, Wait for CI, and Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. PRを自動作成
          gh pr create --base main --head ${{ github.ref_name }} --title "Auto PR: ${{ github.ref_name }}" --body "GitHub Actionsにより自動作成・マージされたPRです" || true

          # 2. 自動マージを予約して、このジョブはすぐに終了する（待機しない！）
          gh pr merge ${{ github.ref_name }} --auto --merge
