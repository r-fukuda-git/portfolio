name: Auto Create PR and Merge

# どのブランチをプッシュした時に発動させるかを指定します
on:
  push:
    branches:
      - "dev"
      - "dev/**"

jobs:
  auto-pr-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR, Wait for CI, and Merge
        env:
          # GitHub Actionsが用意する一時的なトークンを利用します
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. PRを自動作成（既にPRが存在する場合はエラーになるため || true を付けて処理を続行させます）
          gh pr create --base main --head ${{ github.ref_name }} --title "Auto PR: ${{ github.ref_name }}" --body "GitHub Actionsにより自動作成・マージされたPRです" || true

          # GitHubシステム側に dev-ci のジョブが登録されるまで数秒待ちます
          sleep 10

          # 2. CI (テスト) が完了するまで待機する（ここが追加ポイント！）
          echo "dev CI のテスト完了を待機しています..."
          gh pr checks ${{ github.ref_name }} --watch

          # 3. テストが成功した場合のみ、ここが実行されてマージされるの
          echo "テストが成功しました！mainブランチへマージします。"
          gh pr merge ${{ github.ref_name }} --merge --admin
