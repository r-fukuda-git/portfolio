# main ブランチ push → ECR push → ECS サービス更新
# 事前設定: GitHub Repository variables に AWS_DEPLOY_ROLE_ARN（05_cicd output: github_actions_main_role_arn）
name: Main CD

on:
  push:
    branches: [main]
    paths:
      - "golang/cicd-demo/**"
      - ".github/workflows/main-cd.yml"
  workflow_dispatch:

concurrency:
  group: main-cd
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: r-fukuda-prd-app
  ECS_CLUSTER: r-fukuda-prd-ecs-cluster
  ECS_SERVICE: r-fukuda-prd-service
  ECS_CONTAINER_NAME: r-fukuda-prd-service-container
  ECS_TASK_FAMILY: r-fukuda-prd-service-task
  DOCKERFILE_PATH: golang/cicd-demo/Dockerfile
  BUILD_CONTEXT: golang/cicd-demo

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm64
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR registry
        id: ecr
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"

      - name: Go test
        working-directory: golang/cicd-demo
        run: go test ./...

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/arm64
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.image_uri }}:${{ github.sha }}
            ${{ steps.ecr.outputs.image_uri }}:latest

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_FAMILY}" \
            --query taskDefinition \
            --output json | jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )' > task-definition.json

      - name: Render Amazon ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.image_uri }}:${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
