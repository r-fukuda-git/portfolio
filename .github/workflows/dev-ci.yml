name: dev CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load CI paths
        uses: ./.github/actions/load-ci-paths

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_MODULE_PATH }}/go.mod

      - name: Go test
        working-directory: ${{ env.GO_MODULE_PATH }}
        run: go test ./...

      - name: Go build
        working-directory: ${{ env.GO_MODULE_PATH }}
        run: go build -o /tmp/server ./cmd
