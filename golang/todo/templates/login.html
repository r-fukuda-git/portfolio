<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-8">Login to TaskFlow</h2>
        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all">Sign In</button>
        </form>
        <p class="mt-8 text-center text-sm text-gray-500">
            Don't have an account? <a href="/signup" class="text-blue-600 font-bold hover:underline">Sign Up</a>
        </p>
    </div>
</body>
</html>
